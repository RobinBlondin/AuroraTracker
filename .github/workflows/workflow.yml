
name: Docker image build and GitOps deploy

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AuroraTracker
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Copy the JAR file
        run: cp build/libs/AuroraTracker-0.0.1-SNAPSHOT.jar app.jar

      - name: Build and push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t robinblondin/auroratracker:latest \
            -t robinblondin/auroratracker:${{ github.sha }} \
            --file Dockerfile \
            --push .

      - name: Configure GitOps SSH key
        env:
          GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GITOPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout GitOps repository
        run: |
          git clone git@github.com:robinblondin/platform-gitops.git /tmp/platform-gitops

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update AuroraTracker image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd /tmp/platform-gitops/applications/auroratracker/base
          
          kustomize edit set image \
            robinblondin/auroratracker=robinblondin/auroratracker:${IMAGE_TAG}
          
          cd /tmp/platform-gitops
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add applications/auroratracker/base/kustomization.yaml
          git commit -m "Deploy AuroraTracker ${IMAGE_TAG}"
          git push origin main
